name: Crystal CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'development/**'
  pull_request:
    branches:
      - master
      - 'development/**'
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2

      - name: Install dependencies
        run: shards install --skip-postinstall

      # Builds winmd from lib/winmd, fetches the pinned Windows.Win32.winmd and
      # regenerates src/win32cr with the override files in this repo.
      - name: Generate bindings
        shell: pwsh
        run: ./build.ps1

      - name: WinMD version
        run: bin\winmd.exe --version

      - name: Report drift from committed bindings
        shell: pwsh
        run: |
          $changed = git status --porcelain src
          if ($changed) {
            Write-Host "Regenerated bindings differ from the committed ones:"
            git diff --stat src | Select-Object -Last 5
          } else {
            Write-Host "Regenerated bindings match the committed ones."
          }

      - name: Run tests
        run: crystal spec --error-trace

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
        timeout-minutes: 15
        if: ${{ failure() }}
